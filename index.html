<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>360Medicare — Performance Dashboard</title>
<meta name="description" content="360 Medicare Consultancy internal operating platform: Marketing performance, ROI and pipeline reporting." />
<meta name="theme-color" content="#0E2B36" />
<link rel="icon" type="image/png" href="assets/favicon.png" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<meta property="og:title" content="360Medicare" />
<meta property="og:description" content="Marketing performance, ROI and pipeline reporting." />
<!-- Replace with your full https URL after the first deploy for link previews. -->
<meta property="og:image" content="assets/og-image.png" />
<meta property="og:type" content="website" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/styles.css" />
<link rel="stylesheet" href="assets/sept.css" />
<meta name="robots" content="noindex,nofollow" />
</head>
<body>
<div class="toasts" id="toasts"></div>
<div class="login-wrap hidden" id="login">
  <form class="login" onsubmit="doLogin(event)" autocomplete="on">
    <img src="assets/logo-ink.png" alt="360Medicare" />
    <h2>Sign in</h2>
    <p>Performance dashboard and ROI reports. Authorised management only.</p>
    <div class="field"><label class="f" for="lu">Username</label><input id="lu" name="username" autocomplete="username" autocapitalize="none" required /></div>
    <div class="field" style="margin-top:10px"><label class="f" for="lp">Password</label><input id="lp" name="password" type="password" autocomplete="current-password" required /></div>
    <button class="btn" style="width:100%;justify-content:center;margin-top:16px" id="lbtn">Sign in</button>
    <div class="err" id="lerr"></div>
  </form>
</div>
<div id="modal-root"></div>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <button class="iconbtn menubtn" onclick="document.getElementById('sidebar').classList.toggle('open')" aria-label="Menu">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div style="margin-left:auto" class="row">
        <button class="iconbtn" onclick="toggleTheme()" title="Light / dark">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v2m0 14v2M5.6 5.6l1.4 1.4m10 10 1.4 1.4M3 12h2m14 0h2M5.6 18.4 7 17m10-10 1.4-1.4"/><circle cx="12" cy="12" r="3.5"/></svg>
        </button>
        <button class="profile" onclick="profileMenu()" title="Account">
          <span class="avatar" id="me-avatar"></span>
          <span class="who">
            <b id="me-name"></b>
            <i id="me-role"></i>
          </span>
        </button>
      </div>
    </header>
    <main class="content" id="view"></main>
    <footer class="sandbox"><span>360 Medicare Consultancy LLC · confidential, for management use only.</span><span id="asof"></span></footer>
  </div>
</div>

<script src="js/ui.js"></script>
<script src="js/sept.js"></script>
<script src="js/app.js"></script>
</body>
</html>
